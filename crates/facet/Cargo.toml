[package]
name = "facet"
description = "Facet: a fast native Git GUI for Windows 11."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
facet-git = { path = "../facet-git" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "clipboard"] }
raw-window-handle = "0.6"
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify = { version = "8", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
